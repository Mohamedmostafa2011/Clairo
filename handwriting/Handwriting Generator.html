<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handwriting Generator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@700&display=swap');

  :root {
    --rust: #8b3a1a;
    --gold: #c8a84b;
    --panel-bg: #fdf8ee;
    --border: #d4c18a;
    --text-dark: #1a1209;
    --text-muted: #c8b080;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #231709;
    background-image: radial-gradient(ellipse at 15% 25%, #3a2510 0%, transparent 55%),
                      radial-gradient(ellipse at 85% 75%, #160d03 0%, transparent 55%);
    min-height: 100vh;
    font-family: 'Lora', serif;
    color: var(--text-dark);
    display: flex; flex-direction: column; align-items: center;
    padding: 36px 16px 72px;
  }

  header { text-align: center; margin-bottom: 36px; }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.9rem, 4.5vw, 3.1rem);
    color: var(--gold);
    letter-spacing: 0.05em;
    text-shadow: 0 2px 20px rgba(200,168,75,0.35);
    margin-bottom: 7px;
  }
  header p { color: var(--text-muted); font-style: italic; font-size: 0.97rem; }

  .app-shell {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 30px; width: 100%; max-width: 1360px; align-items: start;
  }

  .panel {
    background: var(--panel-bg);
    border: 1px solid var(--border); border-radius: 4px;
    box-shadow: 4px 4px 0 #7a5a1e, 0 10px 36px rgba(0,0,0,0.45);
    padding: 26px 22px; position: sticky; top: 28px;
  }
  .panel-title {
    font-family: 'Playfair Display', serif; font-size: 1.1rem;
    color: var(--rust); border-bottom: 1px solid var(--border);
    padding-bottom: 10px; margin-bottom: 18px; letter-spacing: 0.06em;
  }

  label {
    display: block; font-size: 0.72rem; font-weight: 700;
    letter-spacing: 0.11em; text-transform: uppercase;
    color: #6b4f2a; margin-top: 16px; margin-bottom: 5px;
  }
  label:first-of-type { margin-top: 0; }

  textarea {
    width: 100%; height: 185px;
    border: 1px solid #c8a84b; border-radius: 3px;
    background: #fffdf5; font-family: 'Lora', serif;
    font-size: 0.92rem; color: var(--text-dark); padding: 10px 12px;
    resize: vertical; outline: none;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.05);
    transition: border-color 0.2s; line-height: 1.65;
  }
  textarea:focus { border-color: var(--rust); }

  .slider-row { display: flex; align-items: center; gap: 10px; }
  input[type=range] { flex: 1; accent-color: var(--rust); cursor: pointer; }
  .slider-val { font-size: 0.82rem; color: var(--rust); font-weight: 700; min-width: 44px; text-align: right; }

  /* ── REALTIME TOGGLE ── */
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    background: #f5edd8; border: 1px solid var(--border);
    border-radius: 3px; padding: 10px 14px; margin-top: 16px;
  }
  .toggle-label {
    font-family: 'Playfair Display', serif; font-size: 0.9rem;
    color: var(--rust); letter-spacing: 0.04em;
    display: flex; align-items: center; gap: 8px;
  }
  .toggle-dot { width: 8px; height: 8px; border-radius: 50%; background: #bbb; transition: background 0.3s; }
  .toggle-dot.active { background: #4caf50; box-shadow: 0 0 6px rgba(76,175,80,0.6); }

  .switch {
    position: relative; width: 46px; height: 24px; cursor: pointer;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch-track {
    position: absolute; inset: 0;
    background: #c8b4a0; border-radius: 24px;
    transition: background 0.25s;
  }
  .switch input:checked ~ .switch-track { background: #6aaa5e; }
  .switch-thumb {
    position: absolute; top: 3px; left: 3px;
    width: 18px; height: 18px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    transition: transform 0.25s;
  }
  .switch input:checked ~ .switch-thumb { transform: translateX(22px); }

  /* ── BUTTONS ── */
  .btn {
    display: block; width: 100%; margin-top: 14px; padding: 13px 16px;
    border: none; border-radius: 3px; font-family: 'Playfair Display', serif;
    font-size: 0.97rem; letter-spacing: 0.06em; cursor: pointer;
    transition: filter 0.14s, transform 0.1s, opacity 0.2s;
  }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; }
  .btn:not(:disabled):active { transform: translateY(2px); }

  .btn-generate {
    background: linear-gradient(135deg, #8b3a1a, #bf5825); color: #fff5e0;
    box-shadow: 3px 3px 0 #521507, 0 4px 18px rgba(139,58,26,0.38);
  }
  .btn-generate:not(:disabled):hover { filter: brightness(1.12); }

  .btn-download {
    background: linear-gradient(135deg, #3e6e34, #60a053); color: #fff;
    box-shadow: 3px 3px 0 #1f3e18, 0 4px 18px rgba(62,110,52,0.38);
    display: none;
  }
  .btn-download:not(:disabled):hover { filter: brightness(1.12); }
  .btn-download.visible { display: block; }

  .status { margin-top: 12px; font-size: 0.8rem; color: var(--rust); font-style: italic; min-height: 18px; text-align: center; }

  .error-banner {
    background: #5a1507; color: #ffd0b0; border: 1px solid #8b3a1a;
    border-radius: 3px; padding: 9px 12px; font-size: 0.8rem;
    margin-top: 10px; line-height: 1.5; display: none;
  }
  .error-banner.visible { display: block; }

  /* ── CANVAS AREA ── */
  .canvas-area { display: flex; flex-direction: column; gap: 18px; }
  .canvas-label { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 0.85rem; letter-spacing: 0.13em; text-transform: uppercase; opacity: 0.8; }
  .pages-container { display: flex; flex-direction: column; gap: 32px; }
  .page-wrapper { position: relative; width: 100%; }
  .page-wrapper canvas { width: 100%; height: auto; display: block; border-radius: 2px; box-shadow: 6px 6px 0 #7a5a1e, 0 18px 52px rgba(0,0,0,0.6); }
  .page-num { position: absolute; bottom: -22px; right: 0; font-size: 0.7rem; color: var(--text-muted); font-style: italic; }
  .placeholder-msg { color: var(--text-muted); font-style: italic; font-size: 0.9rem; padding: 48px 0; text-align: center; }

  /* ── LOADING SCREEN ── */
  #loadingOverlay {
    position: fixed; inset: 0; background: #160d03;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; z-index: 9999; transition: opacity 0.55s ease;
  }
  #loadingOverlay.fade-out { opacity: 0; pointer-events: none; }
  #loadingOverlay.gone { display: none; }
  .load-icon { font-size: 2.6rem; animation: sway 2.2s ease-in-out infinite; display: block; }
  @keyframes sway { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(8deg)} }
  .load-title { font-family:'Playfair Display',serif; color:var(--gold); font-size:1.5rem; letter-spacing:0.08em; }
  .progress-track { width:260px; height:5px; background:rgba(200,168,75,0.15); border-radius:3px; overflow:hidden; }
  .progress-fill { height:100%; width:0%; background:linear-gradient(90deg,#c8a84b,#e8c86b); border-radius:3px; transition:width 0.22s ease; }
  .load-sub { color:var(--text-muted); font-style:italic; font-size:0.88rem; }

  @media (max-width: 780px) {
    .app-shell { grid-template-columns: 1fr; }
    .panel { position: static; }
  }
</style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loadingOverlay">
  <span class="load-icon">&#9998;</span>
  <div class="load-title">Handwriting Generator</div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="load-sub" id="loadSub">Connecting to asset server&#8230;</div>
</div>

<header>
  <h1>&#9998; Handwriting Generator</h1>
  <p>Transform your words into your own handwriting &mdash; export as PDF</p>
</header>

<div class="app-shell">

  <!-- LEFT PANEL -->
  <div class="panel">
    <div class="panel-title">&#10022; Compose</div>

    <label for="inputText">Your Text</label>
    <textarea id="inputText">Hello! This is my Handwriting Generator.
It supports Uppercase, lowercase, numbers 0-9 and symbols like: ? ! @ # , . : ;
Words are never split across lines. Type anything you like.</textarea>

    <label for="charScale">Character Size</label>
    <div class="slider-row">
      <input type="range" id="charScale" min="0" max="100" value="40" step="1">
      <span class="slider-val" id="charScaleVal">40px</span>
    </div>

    <label for="lineHeight">Line Spacing</label>
    <div class="slider-row">
      <input type="range" id="lineHeight" min="0" max="100" value="50" step="1">
      <span class="slider-val" id="lineHeightVal">50px</span>
    </div>

    <label for="marginH">Left / Right Margin</label>
    <div class="slider-row">
      <input type="range" id="marginH" min="0" max="100" value="25" step="1">
      <span class="slider-val" id="marginHVal">25px</span>
    </div>

    <label for="wobble">Wobble / Randomness</label>
    <div class="slider-row">
      <input type="range" id="wobble" min="0" max="10" value="0" step="1">
      <span class="slider-val" id="wobbleVal">0</span>
    </div>

    <!-- REALTIME TOGGLE -->
    <div class="toggle-row">
      <div class="toggle-label">
        <span class="toggle-dot" id="realtimeDot"></span>
        Realtime Preview
      </div>
      <label class="switch">
        <input type="checkbox" id="realtimeToggle">
        <span class="switch-track"></span>
        <span class="switch-thumb"></span>
      </label>
    </div>

    <button class="btn btn-generate" id="btnGenerate" disabled>Loading assets&#8230;</button>
    <button class="btn btn-download" id="btnDownload">&#8595; Download PDF</button>
    <div class="error-banner" id="errorBanner"></div>
    <div class="status" id="status"></div>
  </div>

  <!-- RIGHT: PAGES -->
  <div class="canvas-area">
    <div class="canvas-label">&#10022; Preview</div>
    <div class="pages-container" id="pagesContainer">
      <div class="placeholder-msg">Your handwriting preview will appear here after generating.</div>
    </div>
  </div>

</div>

<script>
'use strict';

// ================================================================
//  ASSET URL TABLE  — all images loaded from HuggingFace
// ================================================================
const BASE = 'https://huggingface.co/datasets/MidoSTM11/Mido/resolve/main/Handwriting';
const ASSET_URLS = {};

ASSET_URLS['BG'] = BASE + '/BG.png';

'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(c => {
  ASSET_URLS['uc_' + c] = BASE + '/Letters/Uppercase/' + c + '.png';
});
'abcdefghijklmnopqrstuvwxyz'.split('').forEach(c => {
  ASSET_URLS['lc_' + c] = BASE + '/Letters/Lowercase/' + c + '.png';
});
'0123456789'.split('').forEach(c => {
  ASSET_URLS['num_' + c] = BASE + '/Letters/Numbers/' + c + '.png';
});

const VALID_SPACES = [1, 2, 3, 4, 5, 6, 8, 9, 10];
VALID_SPACES.forEach(n => {
  ASSET_URLS['space_' + n] = BASE + '/Letters/Spaces/space%20' + n + '.png';
});

// Symbols: URL-encoded filename → asset key
[
  ['!.png',               'sym_exclaim'   ],
  ['%23.png',             'sym_hash'      ],
  ['%24.png',             'sym_dollar'    ],
  ['%25.png',             'sym_percent'   ],
  ['%26.png',             'sym_amp'       ],
  ["''.png",              'sym_dquote'    ],
  ["'.png",               'sym_squote'    ],
  ['%28.png',             'sym_lparen'    ],
  ['%29.png',             'sym_rparen'    ],
  ['%2B.png',             'sym_plus'      ],
  ['%2C.png',             'sym_comma'     ],
  ['-.png',               'sym_minus'     ],
  ['..png',               'sym_period'    ],
  ['%3D.png',             'sym_equals'    ],
  ['%40.png',             'sym_at'        ],
  ['back%20slash.png',    'sym_backslash' ],
  ['colon.png',           'sym_colon'     ],
  ['less%20than.png',     'sym_lt'        ],
  ['more%20than.png',     'sym_gt'        ],
  ['question%20mark.png', 'sym_question'  ],
  ['semicolon.png',       'sym_semicolon' ],
  ['slash.png',           'sym_slash'     ],
  ['star.png',            'sym_star'      ],
  ['%5B.png',             'sym_lbracket'  ],
  ['%5D.png',             'sym_rbracket'  ],
  ['%5E.png',             'sym_caret'     ],
  ['_.png',               'sym_underscore'],
  ['%7B.png',             'sym_lbrace'    ],
  ['%7D.png',             'sym_rbrace'    ],
  ['~.png',               'sym_tilde'     ],
  ['%23U00f7.png',        'sym_divide'    ],
].forEach(([file, key]) => {
  ASSET_URLS[key] = BASE + '/Letters/Symbols/' + file;
});

// ================================================================
//  CHARACTER → ASSET KEY
// ================================================================
const DESCENDERS = new Set(['g','j','p','q','y']);

const CHAR_MAP = {};
'abcdefghijklmnopqrstuvwxyz'.split('').forEach(c => CHAR_MAP[c] = 'lc_' + c);
'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(c => CHAR_MAP[c] = 'uc_' + c);
'0123456789'.split('').forEach(c => CHAR_MAP[c] = 'num_' + c);
Object.assign(CHAR_MAP, {
  '!':'sym_exclaim', '#':'sym_hash',    '$':'sym_dollar',
  '%':'sym_percent', '&':'sym_amp',     '"':'sym_dquote',
  "'":"sym_squote",  '(':'sym_lparen',  ')':'sym_rparen',
  '+':'sym_plus',    ',':'sym_comma',   '-':'sym_minus',
  '.':'sym_period',  '=':'sym_equals',  '@':'sym_at',
  '\\':'sym_backslash',':':'sym_colon', '<':'sym_lt',
  '>':'sym_gt',      '?':'sym_question',';':'sym_semicolon',
  '/':'sym_slash',   '*':'sym_star',    '[':'sym_lbracket',
  ']':'sym_rbracket','^':'sym_caret',   '_':'sym_underscore',
  '{':'sym_lbrace',  '}':'sym_rbrace',  '~':'sym_tilde',
  '\u00f7':'sym_divide',
});

function getKey(ch) { return CHAR_MAP[ch] || null; }
function randSpace() { return 'space_' + VALID_SPACES[Math.random() * VALID_SPACES.length | 0]; }

// ================================================================
//  IMAGE LOADER
// ================================================================
const IMG = {};

function loadOne(key, url) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload  = () => { IMG[key] = img; resolve(true); };
    img.onerror = () => resolve(false);
    img.src = url;
  });
}

async function loadAll() {
  const entries = Object.entries(ASSET_URLS);
  const total = entries.length;
  let done = 0;
  const failed = [];
  const fill = document.getElementById('progressFill');
  const sub  = document.getElementById('loadSub');
  const BATCH = 15;
  for (let i = 0; i < entries.length; i += BATCH) {
    const batch = entries.slice(i, i + BATCH);
    const res = await Promise.all(batch.map(([k, u]) => loadOne(k, u)));
    res.forEach((ok, idx) => { done++; if (!ok) failed.push(batch[idx][0]); });
    const pct = Math.round(done / total * 100);
    fill.style.width = pct + '%';
    sub.textContent = 'Loading assets\u2026 ' + done + ' / ' + total;
  }
  return { total, done, failed };
}

// ================================================================
//  A4 DIMENSIONS
// ================================================================
const A4W = 1240, A4H = 1754;

// ================================================================
//  MEASURE WORD WIDTH
//  Returns the pixel width a word token-sequence would take
//  at the given character scale.
// ================================================================
function measureWord(wordTokens, scale) {
  let w = 0;
  for (const tok of wordTokens) {
    if (tok.type !== 'char') continue;
    const img = IMG[tok.key];
    if (!img) continue;
    w += img.naturalWidth * (scale / img.naturalHeight);
  }
  return w;
}

// ================================================================
//  TOKENISE INTO WORD GROUPS
//
//  Returns an array of "segments":
//    { type: 'word',    tokens: [...char tokens] }
//    { type: 'space',   key }
//    { type: 'newline' }
//
//  A "word" is a maximal run of non-space, non-newline characters.
//  Punctuation attached to letters stays in the same word group.
// ================================================================
function segmentText(text) {
  const segments = [];
  let wordBuf = [];

  function flushWord() {
    if (wordBuf.length) {
      segments.push({ type: 'word', tokens: wordBuf });
      wordBuf = [];
    }
  }

  for (const ch of text) {
    if (ch === '\n') {
      flushWord();
      segments.push({ type: 'newline' });
    } else if (ch === ' ') {
      flushWord();
      segments.push({ type: 'space', key: randSpace() });
    } else {
      const key = getKey(ch);
      if (key && IMG[key]) {
        wordBuf.push({ type: 'char', ch, key });
      }
      // unknown char: skip silently
    }
  }
  flushWord();
  return segments;
}

// ================================================================
//  LAYOUT ENGINE  —  word-wrap aware
//
//  Words are NEVER broken across lines unless the word itself is
//  wider than the full line (in that case we fall back to
//  character-level wrapping for that word only).
// ================================================================
function layout(text, scale, lh, mH, mTop, mBot, wobble) {
  const maxX = A4W - mH;
  const maxY = A4H - mBot;
  const segments = segmentText(text);

  const pages = [];
  let lines = [], line = [];
  let cx = mH, cy = mTop;

  // ── helpers ──
  function commitLine() {
    lines.push(line);
    line = [];
    cx = mH;
    cy += lh;
    if (cy + scale > maxY) {
      pages.push(lines);
      lines = [];
      cy = mTop;
    }
  }

  // Place a single char token onto the current line at cx
  function placeChar(tok) {
    const img = IMG[tok.key];
    if (!img) return;
    const dh = scale;
    const dw = img.naturalWidth * (scale / img.naturalHeight);
    const sv = 1 + (Math.random() - 0.5) * 0.04;
    const vOff = (Math.random() - 0.5) * wobble * 1.6
               + (DESCENDERS.has(tok.ch) ? scale * 0.26 : 0);
    line.push({
      tok,
      x: cx, yBase: cy, yOff: vOff,
      dw: dw * sv, dh: dh * sv,
      rot: (Math.random() - 0.5) * wobble * 0.009
    });
    cx += dw * sv + (Math.random() - 0.5) * wobble * 0.3;
  }

  // Place a whole word (array of char tokens) — never split it
  // unless it is wider than the entire line width
  function placeWord(tokens) {
    const wordW = measureWord(tokens, scale);

    if (wordW > (maxX - mH)) {
      // Word is wider than one full line → place char by char with wrapping
      for (const tok of tokens) {
        const img = IMG[tok.key];
        if (!img) continue;
        const dw = img.naturalWidth * (scale / img.naturalHeight);
        if (cx + dw > maxX) commitLine();
        placeChar(tok);
      }
    } else {
      // Word fits on one line — move to next line if it doesn't fit here
      if (cx + wordW > maxX) commitLine();
      for (const tok of tokens) placeChar(tok);
    }
  }

  for (const seg of segments) {
    if (seg.type === 'newline') {
      commitLine();
      continue;
    }

    if (seg.type === 'space') {
      const img = IMG[seg.key];
      if (img) {
        const sw = img.naturalWidth * (scale / img.naturalHeight) * 0.68;
        // Don't add a space at the very start of a line
        if (cx > mH) {
          if (cx + sw > maxX) commitLine(); else cx += sw;
        }
      }
      continue;
    }

    if (seg.type === 'word') {
      placeWord(seg.tokens);
    }
  }

  if (line.length)  lines.push(line);
  if (lines.length) pages.push(lines);
  return pages;
}

// ================================================================
//  RENDER PAGE
// ================================================================
function renderPage(lines) {
  const cv = document.createElement('canvas');
  cv.width = A4W; cv.height = A4H;
  const ctx = cv.getContext('2d');

  if (IMG['BG']) {
    ctx.drawImage(IMG['BG'], 0, 0, A4W, A4H);
  } else {
    ctx.fillStyle = '#fdf9f0';
    ctx.fillRect(0, 0, A4W, A4H);
  }

  for (const line of lines) {
    for (const it of line) {
      const img = IMG[it.tok.key];
      if (!img) continue;
      const px = it.x + it.dw / 2;
      const py = it.yBase + it.yOff + it.dh / 2;
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(it.rot);
      ctx.drawImage(img, -it.dw / 2, -it.dh / 2, it.dw, it.dh);
      ctx.restore();
    }
  }
  return cv;
}

// ================================================================
//  GENERATE  (shared by button click and realtime)
// ================================================================
let canvases = [];
let realtimeTimer = null;

async function generate(silent) {
  const text   = document.getElementById('inputText').value;
  const scale  = +document.getElementById('charScale').value;
  const lh     = +document.getElementById('lineHeight').value;
  const mH     = +document.getElementById('marginH').value;
  const wobble = +document.getElementById('wobble').value;

  if (!text.trim()) {
    document.getElementById('pagesContainer').innerHTML =
      '<div class="placeholder-msg">Your handwriting preview will appear here after generating.</div>';
    canvases = [];
    document.getElementById('btnDownload').classList.remove('visible');
    return;
  }

  canvases = [];
  document.getElementById('pagesContainer').innerHTML = '';
  document.getElementById('btnDownload').classList.remove('visible');
  if (!silent) setStatus('Laying out text\u2026');
  await tick();

  const pages = layout(text, scale, lh, mH, 110, 120, wobble);

  if (!pages.length) {
    if (!silent) setStatus('Nothing to render.');
    return;
  }

  for (let i = 0; i < pages.length; i++) {
    if (!silent) setStatus('Rendering page ' + (i + 1) + ' of ' + pages.length + '\u2026');
    await tick();

    const cv = renderPage(pages[i]);
    canvases.push(cv);

    const wrap = document.createElement('div');
    wrap.className = 'page-wrapper';
    wrap.appendChild(cv);

    const n = document.createElement('div');
    n.className = 'page-num';
    n.textContent = 'Page ' + (i + 1) + ' of ' + pages.length;
    wrap.appendChild(n);

    document.getElementById('pagesContainer').appendChild(wrap);
  }

  document.getElementById('btnDownload').classList.add('visible');
  if (!silent) {
    setStatus('Done \u2014 ' + pages.length + ' page' + (pages.length > 1 ? 's' : '') + ' generated!');
  }
}

// ================================================================
//  PDF EXPORT  — CORRECTED VERSION
// ================================================================
async function exportPDF() {
  if (!canvases.length) { setStatus('Generate first!'); return; }
  const N = canvases.length;
  const PW = 595.28, PH = 841.89; // A4 dimensions in points

  setStatus('Building PDF\u2026'); await tick();

  const enc = new TextEncoder();
  const chunks = [], xref = [];
  const wr  = s => chunks.push(enc.encode(s));
  const wrB = b => chunks.push(b);
  const sz  = () => chunks.reduce((a, c) => a + c.length, 0);

  wr('%PDF-1.4\n%\xFF\xFF\xFF\xFF\n');

  // ── Encode canvases to JPEG blobs ──
  const jpegs = [];
  for (let i = 0; i < N; i++) {
    setStatus('Encoding page ' + (i + 1) + '\u2026'); await tick();
    const buf = await new Promise(resolve => {
      canvases[i].toBlob(blob => {
        blob.arrayBuffer().then(ab => resolve(new Uint8Array(ab)));
      }, 'image/jpeg', 0.93);
    });
    jpegs.push(buf);
  }

  // obj 1: Catalog
  xref.push(sz());
  wr('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');

  // obj 2: Pages
  const kids = Array.from({length: N}, (_, i) => (3 + i * 3) + ' 0 R').join(' ');
  xref.push(sz());
  wr('2 0 obj\n<< /Type /Pages /Kids [' + kids + '] /Count ' + N + ' >>\nendobj\n');

  // For each page, create 3 objects: Page, Content Stream, Image XObject
  for (let i = 0; i < N; i++) {
    const pO = 3 + i * 3; // Page object
    const cO = 4 + i * 3; // Content stream object
    const iO = 5 + i * 3; // Image XObject
    const nm = 'Im' + i;
    const cs = 'q ' + PW.toFixed(2) + ' 0 0 ' + PH.toFixed(2) + ' 0 0 cm /' + nm + ' Do Q';

    // Page object
    xref.push(sz());
    wr(pO + ' 0 obj\n');
    wr('<< /Type /Page /Parent 2 0 R\n');
    wr('/MediaBox [0 0 ' + PW.toFixed(2) + ' ' + PH.toFixed(2) + ']\n');
    wr('/Resources << /XObject << /' + nm + ' ' + iO + ' 0 R >> >>\n');
    wr('/Contents ' + cO + ' 0 R\n');
    wr('>>\nendobj\n');

    // Content Stream object
    xref.push(sz());
    wr(cO + ' 0 obj\n');
    wr('<< /Length ' + cs.length + ' >>\n');
    wr('stream\n' + cs + '\nendstream\nendobj\n');

    // Image XObject (JPEG)
    xref.push(sz());
    wr(iO + ' 0 obj\n');
    wr('<< /Type /XObject /Subtype /Image\n');
    wr('/Width ' + A4W + ' /Height ' + A4H + '\n');
    wr('/ColorSpace /DeviceRGB /BitsPerComponent 8\n');
    wr('/Filter /DCTDecode /Length ' + jpegs[i].length + ' >>\n');
    wr('stream\n');
    wrB(jpegs[i]);
    wr('\nendstream\nendobj\n');
  }

  // xref table
  const xrefPos = sz();
  const totalObj = 2 + N * 3;
  let xs = 'xref\n0 ' + (totalObj + 1) + '\n';
  xs += '0000000000 65535 f \r\n';
  xref.forEach(o => { xs += String(o).padStart(10, '0') + ' 00000 n \r\n'; });
  wr(xs);
  wr('trailer\n<< /Size ' + (totalObj + 1) + ' /Root 1 0 R >>\nstartxref\n' + xrefPos + '\n%%EOF\n');

  const total = sz();
  const out   = new Uint8Array(total);
  let off = 0;
  chunks.forEach(c => { out.set(c, off); off += c.length; });

  const blob = new Blob([out], { type: 'application/pdf' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'handwriting.pdf'; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 8000);
  setStatus('PDF downloaded! (' + N + ' page' + (N > 1 ? 's' : '') + ')');
}

// ================================================================
//  REALTIME TOGGLE
// ================================================================
let realtimeOn = false;

function onRealtimeToggle() {
  realtimeOn = document.getElementById('realtimeToggle').checked;
  const dot = document.getElementById('realtimeDot');
  const btn = document.getElementById('btnGenerate');

  if (realtimeOn) {
    dot.classList.add('active');
    btn.disabled = true;
    btn.textContent = '\u2726 Generate Handwriting';
    setStatus('Realtime mode ON \u2014 preview updates as you type.');
    generate(true); // immediate render
  } else {
    dot.classList.remove('active');
    btn.disabled = false;
    setStatus('Realtime mode OFF \u2014 click Generate when ready.');
  }
}

function scheduleRealtimeRender() {
  if (!realtimeOn) return;
  clearTimeout(realtimeTimer);
  realtimeTimer = setTimeout(() => generate(true), 420); // 420ms debounce
}

// ================================================================
//  HELPERS
// ================================================================
function setStatus(m) { document.getElementById('status').textContent = m; }
function tick()       { return new Promise(r => setTimeout(r, 14)); }

function bindSlider(id, dispId, sfx) {
  const el = document.getElementById(id);
  const dv = document.getElementById(dispId);
  dv.textContent = el.value + sfx;
  el.addEventListener('input', () => {
    dv.textContent = el.value + sfx;
    scheduleRealtimeRender();
  });
}

// ================================================================
//  BOOT
// ================================================================
(async () => {
  bindSlider('charScale',  'charScaleVal',  'px');
  bindSlider('lineHeight', 'lineHeightVal', 'px');
  bindSlider('marginH',    'marginHVal',    'px');
  bindSlider('wobble',     'wobbleVal',     '');

  document.getElementById('btnGenerate').addEventListener('click', () => generate(false));
  document.getElementById('btnDownload').addEventListener('click', exportPDF);
  document.getElementById('realtimeToggle').addEventListener('change', onRealtimeToggle);
  document.getElementById('inputText').addEventListener('input', scheduleRealtimeRender);

  const { total, done, failed } = await loadAll();

  // Dismiss loading screen
  const ov = document.getElementById('loadingOverlay');
  ov.classList.add('fade-out');
  setTimeout(() => ov.classList.add('gone'), 580);

  const btn = document.getElementById('btnGenerate');
  btn.textContent = '\u2726 Generate Handwriting';
  btn.disabled    = false;

  if (failed.length > 0) {
    const critical = failed.filter(k => k === 'BG' || k.startsWith('lc_') || k.startsWith('uc_'));
    if (critical.length > 4) {
      const eb = document.getElementById('errorBanner');
      eb.textContent = '\u26A0 ' + failed.length + ' assets failed to load. Check your internet connection \u2014 images load from HuggingFace.';
      eb.classList.add('visible');
    }
    setStatus('Ready \u2014 ' + done + '/' + total + ' assets loaded.');
  } else {
    setStatus('Ready \u2014 all ' + total + ' assets loaded! Click Generate.');
  }
})();
</script>
