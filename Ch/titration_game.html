<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Titration Lab: Guided Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #f1f5f9;
            --primary: #0ea5e9;
            --danger: #ef4444;
            --highlight: #facc15;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; height: 100dvh; overflow: hidden;
            background: var(--bg);
            font-family: 'Poppins', sans-serif;
            display: flex; flex-direction: column;
        }

        /* --- GUIDE BANNER --- */
        .banner {
            background: #1e293b; color: white; padding: 15px;
            text-align: center; font-size: 1rem; z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex; justify-content: center; gap: 8px;
        }
        .step-tag { color: var(--highlight); font-weight: 800; }

        /* --- LAB STAGE --- */
        .stage {
            flex: 1; position: relative;
            background: radial-gradient(circle at 50% 60%, #cbd5e1 0%, #94a3b8 100%);
        }

        .bench {
            position: absolute; bottom: 0; width: 100%; height: 180px;
            background: #334155; border-top: 8px solid #1e293b;
        }

        /* --- STAND ASSEMBLY --- */
        .stand-wrapper {
            position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%);
            width: 160px; height: 500px; pointer-events: none;
        }
        .base { position: absolute; bottom: 0; width: 100%; height: 20px; background: #0f172a; border-radius: 4px; }
        .rod { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 12px; height: 100%; background: #64748b; }
        .clamp-arm { position: absolute; top: 120px; left: 50%; transform: translateX(-50%); width: 80px; height: 12px; background: #475569; border-radius: 4px; }

        /* --- SNAP ZONES --- */
        .snap-zone {
            position: absolute; 
            border: 3px dashed rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            pointer-events: auto; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 2rem;
            opacity: 0; transition: 0.3s;
        }
        .snap-zone.active { opacity: 1; animation: pulseZone 1.5s infinite; }
        
        @keyframes pulseZone { 
            0% { border-color: rgba(255,255,255,0.6); } 
            50% { border-color: var(--highlight); background: rgba(250, 204, 21, 0.2); } 
            100% { border-color: rgba(255,255,255,0.6); } 
        }

        #zone-burette { top: 50px; left: 50%; transform: translateX(-50%); width: 50px; height: 350px; }
        #zone-flask { bottom: 20px; left: 50%; transform: translateX(-50%); width: 100px; height: 120px; }

        /* --- REAL OBJECTS --- */
        .burette-real {
            position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
            width: 24px; height: 350px;
            background: linear-gradient(90deg, rgba(255,255,255,0.1), rgba(255,255,255,0.4), rgba(255,255,255,0.1));
            border: 2px solid #fff; border-top: none; border-bottom: none;
            display: none; flex-direction: column; justify-content: flex-end;
            z-index: 10; pointer-events: auto; cursor: pointer;
        }
        .liquid-col { width: 100%; height: 0%; background: var(--primary); transition: height 1s linear; }
        
        .tap-assembly {
            position: absolute; bottom: -20px; left: -13px; width: 50px; height: 20px;
            display: flex; align-items: center; justify-content: center;
            pointer-events: auto; z-index: 50;
        }
        .tap-handle {
            width: 40px; height: 10px; background: var(--danger);
            border-radius: 5px; cursor: pointer; transition: transform 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5); border: 1px solid white;
        }
        .tap-handle.open { transform: rotate(90deg); background: #22c55e; }
        .tap-tip {
            position: absolute; bottom: -15px; left: 22px; width: 6px; height: 15px;
            background: rgba(255,255,255,0.5); border: 1px solid white;
        }

        .flask-real {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90px; height: 120px;
            display: none; justify-content: center;
            z-index: 5; cursor: pointer; pointer-events: auto;
        }
        .flask-body {
            width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border: 2px solid white;
            clip-path: polygon(25% 0, 75% 0, 100% 100%, 0% 100%);
            position: relative; overflow: hidden;
        }
        .flask-liq-vol {
            position: absolute; bottom: 0; width: 100%; height: 0%;
            background: #e0f2fe; transition: height 1s, background-color 0.5s;
        }

        /* --- TOOLBAR --- */
        .toolbar {
            height: 130px; background: white; border-top: 1px solid #cbd5e1;
            display: flex; align-items: center; gap: 15px; padding: 0 20px;
            overflow-x: auto; z-index: 50;
        }

        .tool {
            min-width: 90px; height: 100px;
            border: 2px solid #e2e8f0; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 0.8rem; font-weight: 600; color: #64748b;
            position: relative; transition: 0.2s;
        }
        .tool i { font-size: 2rem; margin-bottom: 8px; color: #94a3b8; }
        .tool.selected { border-color: var(--primary); background: #e0f2fe; color: var(--primary); transform: translateY(-5px); }
        .tool.selected i { color: var(--primary); }

        /* --- THE HAND --- */
        .pointer-hand {
            position: absolute; 
            font-size: 3rem; 
            color: var(--danger);
            z-index: 9999; /* Always on top */
            pointer-events: none; /* Click through */
            transition: top 0.3s, left 0.3s;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            /* White stroke for visibility */
            -webkit-text-stroke: 2px white;
        }
        
        /* Animations based on direction */
        .hand-point-up { animation: tapUp 1s infinite; transform-origin: center; }
        @keyframes tapUp { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(10px); } }

        .hand-point-down { animation: tapDown 1s infinite; transform-origin: center; }
        @keyframes tapDown { 0%, 100% { transform: rotate(180deg) translateY(0); } 50% { transform: rotate(180deg) translateY(10px); } }

    </style>
</head>
<body>

    <div class="banner">
        <span id="step-tag" class="step-tag">STEP 1:</span>
        <span id="instruction">Select the Burette from the toolbar.</span>
    </div>

    <div class="stage">
        <div class="bench"></div>

        <div class="stand-wrapper">
            <div class="base"></div>
            <div class="rod"></div>
            <div class="clamp-arm"></div>
            
            <div id="zone-burette" class="snap-zone" onclick="placeObject('burette')"><i class="fa-solid fa-plus"></i></div>
            <div id="zone-flask" class="snap-zone" onclick="placeObject('flask')"><i class="fa-solid fa-plus"></i></div>

            <div id="obj-burette" class="burette-real">
                <div id="liq-burette" class="liquid-col"></div>
                <div class="tap-assembly">
                    <div id="knob" class="tap-handle" onclick="toggleTap()"></div>
                    <div class="tap-tip"></div>
                </div>
            </div>

            <div id="obj-flask" class="flask-real" onclick="fillFlaskInteraction()">
                <div class="flask-body">
                    <div id="liq-flask" class="flask-liq-vol"></div>
                </div>
            </div>
        </div>
        
        <!-- THE HAND -->
        <div id="hand" class="pointer-hand fa-solid fa-hand-pointer" style="display:none;"></div>
    </div>

    <div class="toolbar">
        <div class="tool" id="tool-burette" onclick="selectTool('burette')"><i class="fa-solid fa-ruler-vertical"></i> Burette</div>
        <div class="tool" id="tool-acid" onclick="selectTool('acid')"><i class="fa-solid fa-bottle-water"></i> Acid</div>
        <div class="tool" id="tool-flask" onclick="selectTool('flask')"><i class="fa-solid fa-flask"></i> Flask</div>
        <div class="tool" id="tool-pipette" onclick="selectTool('pipette')"><i class="fa-solid fa-eye-dropper"></i> Pipette</div>
        <div class="tool" id="tool-ind" onclick="selectTool('ind')"><i class="fa-solid fa-vial"></i> Indicator</div>
    </div>

    <script>
        let currentStep = 1;
        
        const hand = document.getElementById('hand');
        const tag = document.getElementById('step-tag');
        const text = document.getElementById('instruction');
        const knob = document.getElementById('knob');

        const steps = {
            1: { msg: "Tap the Burette tool.", highlight: "tool-burette", action: "select" },
            2: { msg: "Tap the dashed zone to Clamp.", highlight: "zone-burette", action: "place" },
            3: { msg: "Tap the Acid Bottle.", highlight: "tool-acid", action: "select" },
            4: { msg: "Tap the Burette to Fill.", highlight: "obj-burette", action: "fill" },
            5: { msg: "Tap the Flask tool.", highlight: "tool-flask", action: "select" },
            6: { msg: "Tap the dashed zone to Place.", highlight: "zone-flask", action: "place" },
            7: { msg: "Tap the Pipette (Alkali).", highlight: "tool-pipette", action: "select" },
            8: { msg: "Tap the Flask to add Alkali.", highlight: "obj-flask", action: "fill" },
            9: { msg: "Tap the Indicator.", highlight: "tool-ind", action: "select" },
            10: { msg: "Tap the Flask to add Color.", highlight: "obj-flask", action: "fill" },
            11: { msg: "Tap the Red Lever to Titrate!", highlight: "knob", action: "click" }
        };

        updateGuide();

        function updateGuide() {
            const s = steps[currentStep];
            if(!s) return;

            tag.innerText = `STEP ${currentStep}:`;
            text.innerText = s.msg;

            document.querySelectorAll('.snap-zone').forEach(z => z.classList.remove('active'));
            document.querySelectorAll('.tool').forEach(t => t.classList.remove('selected'));
            
            const target = document.getElementById(s.highlight);
            if(target) {
                pointHand(target);
                if(s.action === "place") target.classList.add('active');
            }
        }

        function pointHand(el) {
            hand.style.display = 'block';
            const rect = el.getBoundingClientRect();
            
            // If target is in toolbar (Bottom)
            if(el.classList.contains('tool')) {
                hand.className = "pointer-hand hand-point-down";
                // Position Above
                hand.style.left = (rect.left + rect.width/2 - 20) + 'px'; 
                hand.style.top = (rect.top - 60) + 'px';
            } 
            // If target is in Lab (Top)
            else {
                hand.className = "pointer-hand hand-point-up";
                // Position Below
                hand.style.left = (rect.left + rect.width/2 - 20) + 'px'; 
                hand.style.top = (rect.bottom + 10) + 'px';
                
                // Special case for Zone Burette (it's tall, hand should be in middle)
                if(el.id === 'zone-burette' || el.id === 'obj-burette') {
                    hand.style.top = (rect.top + rect.height/2) + 'px';
                }
                // Special case for Knob (Small target)
                if(el.id === 'knob') {
                     hand.style.top = (rect.bottom + 5) + 'px';
                }
            }
        }

        function selectTool(name) {
            const s = steps[currentStep];
            if(s.action === "select" && s.highlight === `tool-${name}`) {
                document.getElementById(`tool-${name}`).classList.add('selected');
                nextStep();
            } else {
                shake(document.getElementById(`tool-${name}`));
            }
        }

        function placeObject(type) {
            const s = steps[currentStep];
            if(s.action === "place" && s.highlight === `zone-${type}`) {
                document.getElementById(`zone-${type}`).classList.remove('active');
                document.getElementById(`obj-${type}`).style.display = 'flex';
                nextStep();
            }
        }

        document.getElementById('obj-burette').onclick = function() {
            if(currentStep === 4) {
                document.getElementById('liq-burette').style.height = '90%';
                nextStep();
            }
        };

        function fillFlaskInteraction() {
            if(currentStep === 8) {
                document.getElementById('liq-flask').style.height = '40%';
                nextStep();
            } else if (currentStep === 10) {
                document.getElementById('liq-flask').style.backgroundColor = '#f472b6';
                nextStep();
            }
        }

        function toggleTap() {
            if(currentStep === 11) {
                knob.classList.add('open');
                hand.style.display = 'none';
                
                tag.innerText = "RUNNING...";
                text.innerText = "Watch the color change!";
                
                const bLiq = document.getElementById('liq-burette');
                const fLiq = document.getElementById('liq-flask');

                setTimeout(() => {
                    bLiq.style.height = '40%';
                    fLiq.style.height = '55%';
                    
                    setTimeout(() => {
                        fLiq.style.backgroundColor = '#e0f2fe';
                        knob.classList.remove('open');
                        tag.innerText = "SUCCESS!";
                        text.innerText = "Endpoint Reached.";
                        document.body.style.background = "#dcfce7";
                    }, 2500);
                }, 300);
            }
        }

        function nextStep() {
            currentStep++;
            updateGuide();
        }

        function shake(el) {
            el.style.transform = 'translateX(5px)';
            setTimeout(() => el.style.transform = 'translateX(-5px)', 50);
            setTimeout(() => el.style.transform = 'translateX(0)', 100);
        }
    </script>
</body>
</html>
