<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chapter 22 — Virtual Lab Walkthrough</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#060e1a;
  --glass:rgba(255,255,255,0.06);
  --glass-b:rgba(255,255,255,0.12);
  --txt:#dff0ff;
  --dim:rgba(223,240,255,0.5);
  --blue:#5ce0ff;
  --teal:#00f5c4;
  --purple:#b794f4;
  --gold:#fbbf24;
  --red:#fb7185;
  --green:#4ade80;
}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--txt);
  min-height:100vh;
  overflow-x:hidden;
}

/* ── WATER BG ── */
.bg{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 60% 50% at 15% 25%, rgba(0,80,140,0.25) 0%, transparent 70%),
    radial-gradient(ellipse 50% 60% at 85% 75%, rgba(0,40,80,0.3) 0%, transparent 70%),
    #060e1a;
}
.wave{
  position:fixed;bottom:0;left:0;width:200%;height:120px;
  background:linear-gradient(180deg,transparent,rgba(0,100,180,0.04));
  animation:wave 8s linear infinite;
  z-index:0;border-radius:50% 50% 0 0;
}
.wave2{animation-delay:-4s;opacity:.5;background:linear-gradient(180deg,transparent,rgba(0,200,180,0.03));}
@keyframes wave{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}

/* ── LAYOUT ── */
.shell{
  position:relative;z-index:1;
  display:grid;
  grid-template-columns:220px 1fr;
  grid-template-rows:auto 1fr;
  min-height:100vh;
}

/* ── TOP BAR ── */
.topbar{
  grid-column:1/-1;
  padding:1.2rem 2rem;
  background:rgba(6,14,26,0.8);
  border-bottom:1px solid var(--glass-b);
  backdrop-filter:blur(20px);
  display:flex;align-items:center;gap:1.5rem;
  flex-wrap:wrap;
}
.topbar h1{
  font-size:1.1rem;font-weight:700;
  background:linear-gradient(120deg,var(--blue),var(--teal));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.cat-tabs{display:flex;gap:0.4rem;flex-wrap:wrap;}
.cat-btn{
  background:var(--glass);border:1px solid var(--glass-b);
  color:var(--dim);padding:0.35rem 1rem;border-radius:50px;
  font-size:0.78rem;font-weight:600;cursor:pointer;
  font-family:'DM Sans',sans-serif;
  transition:all .25s;letter-spacing:.02em;
}
.cat-btn.on{background:rgba(92,224,255,0.12);border-color:var(--blue);color:var(--blue);}
.cat-btn:hover{color:var(--txt);}

/* ── SIDEBAR ── */
.sidebar{
  border-right:1px solid var(--glass-b);
  background:rgba(0,0,0,0.2);
  backdrop-filter:blur(16px);
  padding:1rem 0.7rem;
  overflow-y:auto;
  height:calc(100vh - 57px);
  position:sticky;top:57px;
}
.ion-btn{
  width:100%;text-align:left;
  background:none;border:1px solid transparent;
  color:var(--dim);padding:0.6rem 0.9rem;
  border-radius:12px;cursor:pointer;
  font-family:'DM Sans',sans-serif;font-size:0.85rem;
  display:flex;align-items:center;gap:0.6rem;
  transition:all .2s;margin-bottom:0.3rem;
}
.ion-btn:hover{background:var(--glass);color:var(--txt);}
.ion-btn.on{
  background:rgba(92,224,255,0.1);
  border-color:rgba(92,224,255,0.25);
  color:var(--blue);font-weight:600;
}
.ion-formula{
  font-family:'JetBrains Mono',monospace;
  font-size:0.9rem;font-weight:700;min-width:48px;
}
.ion-name{font-size:0.75rem;color:inherit;opacity:.8;}

/* ── MAIN AREA ── */
.main{
  display:flex;flex-direction:column;
  padding:1.5rem;gap:1.5rem;
  min-height:calc(100vh - 57px);
}

/* ── EXPERIMENT AREA ── */
.lab{
  display:grid;
  grid-template-columns:200px 1fr;
  gap:1.5rem;
  background:var(--glass);
  border:1px solid var(--glass-b);
  border-radius:24px;
  padding:1.5rem;
  backdrop-filter:blur(24px);
  flex-shrink:0;
}

/* ── TUBE ANIMATION ── */
.tube-wrap{
  display:flex;flex-direction:column;
  align-items:center;gap:0.8rem;
}
.tube-label{
  font-family:'JetBrains Mono',monospace;
  font-size:1.3rem;font-weight:700;color:var(--blue);
  text-align:center;line-height:1.2;
}
.tube-name{font-size:0.75rem;color:var(--dim);text-align:center;}

/* SVG tube container */
.tube-svg-wrap{
  width:90px;height:200px;
  position:relative;
}

/* Reagent drops */
.drop-container{
  position:absolute;top:0;left:50%;
  transform:translateX(-50%);
  width:30px;height:60px;
  pointer-events:none;
  z-index:5;
}
.drop{
  width:8px;height:12px;
  border-radius:50% 50% 50% 50% / 40% 40% 60% 60%;
  position:absolute;left:50%;transform:translateX(-50%);
  animation:drop-fall 0.8s ease-in forwards;
  opacity:0;
}
@keyframes drop-fall{
  0%{top:0;opacity:1;}
  100%{top:50px;opacity:0;}
}

.gas-bubble{
  position:absolute;
  border-radius:50%;
  border:1.5px solid rgba(255,255,255,0.4);
  animation:bubble-rise 1.2s ease-in forwards;
  opacity:0;
}
@keyframes bubble-rise{
  0%{bottom:30%;opacity:.8;transform:scale(0.5);}
  100%{bottom:100%;opacity:0;transform:scale(1.2);}
}

.ppt-particle{
  position:absolute;
  border-radius:50%;
  animation:settle 1s ease-out forwards;
  opacity:0;
}
@keyframes settle{
  0%{transform:translateY(-30px);opacity:1;}
  80%{opacity:0.9;}
  100%{transform:translateY(0);opacity:0.8;}
}

/* Step info panel */
.step-panel{
  display:flex;flex-direction:column;gap:1rem;
}
.step-counter{
  font-family:'JetBrains Mono',monospace;
  font-size:0.7rem;letter-spacing:.15em;
  color:var(--dim);text-transform:uppercase;
}
.step-progress{
  height:3px;background:rgba(255,255,255,0.07);
  border-radius:10px;overflow:hidden;margin-bottom:.5rem;
}
.step-fill{
  height:100%;border-radius:10px;
  background:linear-gradient(90deg,var(--blue),var(--teal));
  transition:width .5s ease;
}
.action-box{
  background:rgba(92,224,255,0.07);
  border:1px solid rgba(92,224,255,0.2);
  border-radius:14px;padding:1rem 1.2rem;
}
.action-tag{
  font-size:0.65rem;text-transform:uppercase;
  letter-spacing:.15em;color:var(--blue);
  font-family:'JetBrains Mono',monospace;margin-bottom:.3rem;
}
.action-text{font-size:1rem;font-weight:600;line-height:1.5;color:var(--txt);}

.obs-box{
  background:rgba(0,245,196,0.07);
  border:1px solid rgba(0,245,196,0.2);
  border-radius:14px;padding:1rem 1.2rem;
  animation:fadeUp .4s ease forwards;
  opacity:0;
}
.obs-box.show{opacity:1;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.obs-tag{font-size:.65rem;text-transform:uppercase;letter-spacing:.15em;color:var(--teal);font-family:'JetBrains Mono',monospace;margin-bottom:.3rem;}
.obs-text{font-size:.95rem;font-weight:600;color:var(--txt);}
.obs-text span.highlight{color:var(--teal);font-weight:700;}

.why-box{
  background:rgba(167,139,250,0.07);
  border:1px solid rgba(167,139,250,0.2);
  border-radius:14px;padding:.8rem 1rem;
  animation:fadeUp .4s ease .15s forwards;
  opacity:0;
  font-size:.82rem;color:var(--dim);line-height:1.6;
}
.why-box.show{opacity:1;}
.why-box b{color:var(--purple);}

/* Buttons */
.btn-row{display:flex;gap:.7rem;align-items:center;margin-top:.3rem;flex-wrap:wrap;}
.btn{
  background:rgba(92,224,255,0.1);
  border:1px solid rgba(92,224,255,0.3);
  color:var(--blue);padding:.55rem 1.4rem;
  border-radius:50px;font-family:'DM Sans',sans-serif;
  font-size:.83rem;font-weight:600;cursor:pointer;
  transition:all .2s;
}
.btn:hover{background:rgba(92,224,255,0.2);transform:translateY(-1px);}
.btn:disabled{opacity:.3;pointer-events:none;}
.btn-rev{background:rgba(251,191,36,0.1);border-color:rgba(251,191,36,0.3);color:var(--gold);}
.btn-rev:hover{background:rgba(251,191,36,0.2);}
.btn-next{background:rgba(0,245,196,0.1);border-color:rgba(0,245,196,0.3);color:var(--teal);}
.btn-next:hover{background:rgba(0,245,196,0.2);}

/* ── MEMORY HOOK ── */
.mem-hook{
  background:linear-gradient(135deg,rgba(251,191,36,.08),rgba(251,191,36,.03));
  border:1px solid rgba(251,191,36,.25);
  border-radius:16px;padding:1rem 1.2rem;
  animation:fadeUp .5s ease forwards;opacity:0;
  display:none;
}
.mem-hook.show{display:block;}
.mem-hook.anim{opacity:1;}
.mem-tag{font-size:.65rem;text-transform:uppercase;letter-spacing:.15em;color:var(--gold);font-family:'JetBrains Mono',monospace;margin-bottom:.4rem;}
.mem-text{font-size:1rem;font-weight:600;color:var(--txt);line-height:1.5;}
.mem-text em{color:var(--gold);font-style:normal;font-weight:700;}

/* ── COMPARISON TABLE (below lab) ── */
.compare-card{
  background:var(--glass);border:1px solid var(--glass-b);
  border-radius:20px;padding:1.2rem 1.5rem;
  backdrop-filter:blur(16px);
  display:none;
}
.compare-card.show{display:block;}
.compare-title{
  font-size:.72rem;text-transform:uppercase;letter-spacing:.15em;
  color:var(--dim);font-family:'JetBrains Mono',monospace;
  margin-bottom:.8rem;
}
.cmp-table{width:100%;border-collapse:separate;border-spacing:0 .4rem;}
.cmp-table th{
  font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;
  color:var(--dim);font-weight:600;padding:.4rem .8rem;text-align:left;
}
.cmp-table td{
  padding:.55rem .8rem;font-size:.82rem;
  background:rgba(255,255,255,0.04);
  border-top:1px solid rgba(255,255,255,0.05);
  border-bottom:1px solid rgba(255,255,255,0.05);
}
.cmp-table td:first-child{border-left:1px solid rgba(255,255,255,0.05);border-radius:8px 0 0 8px;}
.cmp-table td:last-child{border-right:1px solid rgba(255,255,255,0.05);border-radius:0 8px 8px 0;}
.cmp-table tr.hl td{background:rgba(92,224,255,0.07);border-color:rgba(92,224,255,0.12);}
.yes{color:var(--green);font-weight:700;}
.no{color:var(--red);font-weight:700;}

/* ── PLACEHOLDER ── */
.placeholder{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  height:250px;gap:.8rem;
  color:var(--dim);font-size:.9rem;text-align:center;
}
.placeholder .big{font-size:3rem;opacity:.3;}

/* ── RESPONSIVE ── */
@media(max-width:700px){
  .shell{grid-template-columns:1fr;}
  .sidebar{display:none;}
  .lab{grid-template-columns:1fr;}
  .tube-wrap{flex-direction:row;justify-content:flex-start;}
}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wave"></div>
<div class="wave wave2"></div>

<div class="shell">

<!-- TOP BAR -->
<div class="topbar">
  <h1>🔬 Chapter 22 — Virtual Lab</h1>
  <div class="cat-tabs">
    <button class="cat-btn on" onclick="setCategory('cations',this)">🔵 Cations</button>
    <button class="cat-btn" onclick="setCategory('anions',this)">🔴 Anions</button>
    <button class="cat-btn" onclick="setCategory('gases',this)">🟢 Gases</button>
  </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar"></div>

<!-- MAIN -->
<div class="main">

  <!-- LAB -->
  <div class="lab" id="lab">
    <div class="placeholder" style="grid-column:1/-1">
      <div class="big">⚗️</div>
      <div>Pick an ion or gas from the sidebar<br>to start the animated walkthrough</div>
    </div>
  </div>

  <!-- COMPARISON -->
  <div class="compare-card" id="cmp-card">
    <div class="compare-title" id="cmp-title">Comparison Table</div>
    <table class="cmp-table" id="cmp-table"></table>
  </div>

</div>
</div>

<script>
// ════════════════════════════════════
//  DATA
// ════════════════════════════════════
const data = {
  cations: [
    {
      id:'nh4', formula:'NH₄⁺', name:'Ammonium', color:'#b794f4',
      initColor:'rgba(200,200,255,0.15)', initLabel:'NH₄⁺ solution',

      compare: null
    },
    {

        {

          obs:'Ppt slowly turns <span class="highlight">BROWN 🟤</span> (bonus mark!)',

      ],
      mnemonic:'<em>TWO = GREEN</em> — Fe-2 = like 2 green leaves 🌿. And if you wait, it goes brown as Fe²⁺ gets oxidised to Fe³⁺ by air.',

        rows:[
          {label:'Fe²⁺', vals:['🟢 Green','No ❌','🟢 Green'], hl:true},
          {label:'Fe³⁺', vals:['🟤 Brown/Rust','No ❌','🟤 Brown'], hl:false}
        ]
      }
    },
    {

    {

      initColor:'rgba(200,220,240,0.12)', initLabel:'Collected gas (colourless)',
      steps:[
        {
          action:'Observe: colour and smell',
          reagentColor:null,
          tubeColor:'rgba(200,220,240,0.12)',
          ppt:false,gas:true,gasColor:'rgba(200,210,230,0.3)',
          obs:'<span class="highlight">Colourless, choking/acidic smell</span> (similar to SO₂)',
          why:'HCl gas is colourless and acidic-smelling. Need the specific test to distinguish from SO₂.'
        },
        {
          action:'Hold a glass rod dipped in NH₃ solution near the gas',
          reagentColor:null,
          tubeColor:'rgba(200,220,240,0.12)',
          ppt:false,gas:false,
          obs:'<span class="highlight">Dense WHITE SMOKE 💨 forms in air</span>',
          why:'<b>HCl(g) + NH₃(g) → NH₄Cl(s)</b> — ammonium chloride forms as tiny solid white particles in the air = white smoke. Confirmed: HCl!'
        }
      ],
      mnemonic:'<em>HCl = White smoke with ammonia</em> — hold an ammonia rod near HCl gas → instant white smoke signal. It\'s like HCl calling for NH₃ and creating a smoke signal! 📡',
      compare: null
    }
  ]
};

// ════════════════════════════════════
//  STATE
// ════════════════════════════════════
let currentCat = 'cations';
let currentIon = null;
let currentStep = 0;
let stepRevealed = false;
let particles = [];

// ════════════════════════════════════
//  BUILD SIDEBAR
// ════════════════════════════════════
function buildSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';
  const list = data[currentCat];
  list.forEach((ion, i) => {
    const btn = document.createElement('button');
    btn.className = 'ion-btn' + (currentIon && currentIon.id === ion.id ? ' on' : '');
    btn.innerHTML = `<span class="ion-formula" style="color:${ion.color}">${ion.formula}</span>
      <span class="ion-name">${ion.name}</span>`;
    btn.onclick = () => loadIon(ion);
    sb.appendChild(btn);
  });
}

function setCategory(cat, btn) {
  currentCat = cat;
  currentIon = null;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  buildSidebar();
  document.getElementById('lab').innerHTML = `<div class="placeholder" style="grid-column:1/-1">
    <div class="big">⚗️</div>
    <div>Pick an ion or gas from the sidebar<br>to start the animated walkthrough</div>
  </div>`;
  document.getElementById('cmp-card').classList.remove('show');
}

// ════════════════════════════════════
//  LOAD ION
// ════════════════════════════════════
function loadIon(ion) {
  currentIon = ion;
  currentStep = 0;
  stepRevealed = false;
  buildSidebar();
  renderLab();
}

// ════════════════════════════════════
//  RENDER LAB
// ════════════════════════════════════
function renderLab() {
  const ion = currentIon;
  const step = ion.steps[currentStep];
  const total = ion.steps.length;
  const pct = ((currentStep) / total) * 100;

  document.getElementById('lab').innerHTML = `
    <div class="tube-wrap">
      <div class="tube-label" style="color:${ion.color}">${ion.formula}</div>
      <div class="tube-name">${ion.name}</div>
      <div class="tube-svg-wrap" id="tube-svg-wrap">
        ${buildTubeSVG(ion.initColor, ion.initLabel)}
      </div>
    </div>

    <div class="step-panel">
      <div>
        <div class="step-counter">Step ${currentStep+1} of ${total}</div>
        <div class="step-progress">
          <div class="step-fill" style="width:${pct}%"></div>
        </div>
      </div>

      <div class="action-box">
        <div class="action-tag">🧪 Do This</div>
        <div class="action-text">${step.action}</div>
      </div>

      <div class="obs-box" id="obs-box" style="display:none">
        <div class="obs-tag">👁 Observation</div>
        <div class="obs-text">${step.obs}</div>
      </div>

      <div class="why-box" id="why-box" style="display:none">
        <b>Why?</b> ${step.why}
      </div>

      <div class="mem-hook" id="mem-hook">
        <div class="mem-tag">🧠 Memory Hook</div>
        <div class="mem-text">${ion.mnemonic}</div>
      </div>

      <div class="btn-row">
        <button class="btn btn-rev" onclick="revealStep()">👁 Reveal Observation</button>
        <button class="btn btn-next" id="btn-next" onclick="nextStep()" ${currentStep===0?'disabled':''} style="display:none">→ Next Step</button>
        <button class="btn btn-next" id="btn-restart" onclick="loadIon(currentIon)" style="display:none">↺ Restart</button>
      </div>
    </div>
  `;

  // hide compare
  document.getElementById('cmp-card').classList.remove('show');
}

function buildTubeSVG(liquidColor, label) {
  return `
  <svg width="90" height="200" viewBox="0 0 90 200" xmlns="http://www.w3.org/2000/svg" id="main-tube">
    <!-- tube outline -->
    <defs>
      <clipPath id="tube-clip">
        <path d="M25,10 L25,155 Q25,175 45,175 Q65,175 65,155 L65,10 Z"/>
      </clipPath>
      <linearGradient id="glass-shine" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="rgba(255,255,255,0.15)"/>
        <stop offset="0.3" stop-color="rgba(255,255,255,0.05)"/>
        <stop offset="1" stop-color="rgba(255,255,255,0.02)"/>
      </linearGradient>
    </defs>
    <!-- tube walls -->
    <path d="M25,10 L25,155 Q25,175 45,175 Q65,175 65,155 L65,10" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <!-- liquid -->
    <rect id="tube-liquid" x="25" y="90" width="40" height="85" clip-path="url(#tube-clip)" fill="${liquidColor}" style="transition:fill 1s ease;"/>
    <!-- glass shine -->
    <rect x="25" y="10" width="40" height="165" clip-path="url(#tube-clip)" fill="url(#glass-shine)"/>
    <!-- rim -->
    <rect x="22" y="8" width="46" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
    <!-- particles container -->
    <g id="ppt-layer"></g>
    <!-- bubbles -->
    <g id="bubble-layer"></g>
  </svg>`;
}

// ════════════════════════════════════
//  REVEAL STEP
// ════════════════════════════════════
function revealStep() {
  const ion = currentIon;
  const step = ion.steps[currentStep];
  stepRevealed = true;

  // Show obs + why
  const obs = document.getElementById('obs-box');
  const why = document.getElementById('why-box');
  obs.style.display = 'block';
  why.style.display = 'block';
  setTimeout(()=>{obs.classList.add('show'); why.classList.add('show');},10);

  // Animate tube
  animateTube(step);

  // Hide reveal btn
  document.querySelector('.btn-rev').style.display = 'none';

  const isLast = currentStep === ion.steps.length - 1;

  if (isLast) {
    // Show memory hook + restart
    setTimeout(() => {
      const mh = document.getElementById('mem-hook');
      mh.classList.add('show');
      setTimeout(()=>mh.classList.add('anim'),10);
      document.getElementById('btn-restart').style.display = 'inline-block';

      // Show compare
      if (ion.compare) {
        buildCompare(ion.compare);
      }
    }, 800);
  } else {
    document.getElementById('btn-next').style.display = 'inline-block';
    document.getElementById('btn-next').disabled = false;
  }

  // Update progress fill
  const pct = ((currentStep + 1) / ion.steps.length) * 100;
  document.querySelector('.step-fill').style.width = pct + '%';
}

function animateTube(step) {
  // Change liquid color
  const liquid = document.getElementById('tube-liquid');
  if (liquid && step.tubeColor) {
    setTimeout(()=>{ liquid.style.fill = step.tubeColor; }, 400);
  }

  // Drop animation
  if (step.reagentColor) {
    const wrap = document.getElementById('tube-svg-wrap');
    for (let i = 0; i < 4; i++) {
      setTimeout(() => {
        const d = document.createElement('div');
        d.className = 'drop';
        d.style.cssText = `background:${step.reagentColor};animation-delay:${i*0.1}s;left:${40+Math.random()*10}px;`;
        const dc = document.createElement('div');
        dc.className = 'drop-container';
        dc.appendChild(d);
        wrap.appendChild(dc);
        setTimeout(()=>dc.remove(), 1200);
      }, i * 100);
    }
  }

  // Precipitate particles
  if (step.ppt && step.pptColor) {
    const pptLayer = document.getElementById('ppt-layer');
    if (pptLayer) {
      setTimeout(() => {
        for (let i = 0; i < 18; i++) {
          const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
          const x = 27 + Math.random() * 36;
          const finalY = 140 + Math.random() * 28;
          circle.setAttribute('cx', x);
          circle.setAttribute('cy', finalY - 25);
          circle.setAttribute('r', 2 + Math.random() * 3);
          circle.setAttribute('fill', step.pptColor);
          circle.setAttribute('opacity','0');
          pptLayer.appendChild(circle);
          setTimeout(()=>{
            circle.setAttribute('cy', finalY);
            circle.setAttribute('opacity','0.85');
            circle.style.transition = 'cy 0.8s ease-out, opacity 0.4s';
          }, 50 + i * 40);
        }
      }, 500);
    }
  } else if (!step.ppt) {
    // Clear ppt
    setTimeout(()=>{
      const pl = document.getElementById('ppt-layer');
      if(pl) pl.innerHTML = '';
    }, 600);
  }

  // Gas bubbles
  if (step.gas) {
    const bl = document.getElementById('bubble-layer');
    if (bl) {
      const interval = setInterval(() => {
        for (let i = 0; i < 2; i++) {
          const c = document.createElementNS('http://www.w3.org/2000/svg','ellipse');
          const x = 32 + Math.random() * 26;
          c.setAttribute('cx', x);
          c.setAttribute('cy', 150);
          c.setAttribute('rx', 3 + Math.random() * 4);
          c.setAttribute('ry', 4 + Math.random() * 5);
          c.setAttribute('fill','none');
          c.setAttribute('stroke', step.gasColor || 'rgba(200,230,255,0.5)');
          c.setAttribute('stroke-width','1');
          c.setAttribute('opacity','0.8');
          bl.appendChild(c);
          let pos = 150;
          const rise = setInterval(() => {
            pos -= 3;
            c.setAttribute('cy', pos);
            c.setAttribute('opacity', Math.max(0, (pos - 60) / 90));
            if (pos < 60) { clearInterval(rise); c.remove(); }
          }, 30);
        }
      }, 250);
      setTimeout(()=>clearInterval(interval), 2500);
    }
  }
}

// ════════════════════════════════════
//  NEXT STEP
// ════════════════════════════════════
function nextStep() {
  currentStep++;
  stepRevealed = false;
  renderLab();
}

// ════════════════════════════════════
//  COMPARISON TABLE
// ════════════════════════════════════
function buildCompare(cmp) {
  const card = document.getElementById('cmp-card');
  const title = document.getElementById('cmp-title');
  const table = document.getElementById('cmp-table');

  title.textContent = cmp.title;
  let html = '<thead><tr>';
  html += `<th>Ion</th>`;
  cmp.headers.forEach(h => html += `<th>${h}</th>`);
  html += '</tr></thead><tbody>';
  cmp.rows.forEach(row => {
    html += `<tr class="${row.hl?'hl':''}"><td><b>${row.label}</b></td>`;
    row.vals.forEach(v => {
      const cls = v.includes('✅') ? 'yes' : v.includes('❌') ? 'no' : '';
      html += `<td class="${cls}">${v}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody>';
  table.innerHTML = html;
  card.classList.add('show');
}

// ════════════════════════════════════
//  INIT
// ════════════════════════════════════
buildSidebar();
</script>
</body>
</html>
